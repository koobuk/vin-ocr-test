<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강화된 무료 OCR (VIN 전용)</title>
    <script async src="https://opencv.org" onload="onOpenCvReady();"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin:0; padding:20px; background:#f0f2f5; font-family:sans-serif; }
        .card { background:white; border-radius:15px; padding:25px; box-shadow:0 4px 15px rgba(0,0,0,0.1); max-width:500px; margin:auto; }
        .title { font-size:18px; font-weight:bold; margin-bottom:15px; color:#1a73e8; text-align:center; }
        .input-row { display:flex; gap:10px; }
        #vinNo { flex:1; height:50px; font-size:18px; padding:0 15px; border:2px solid #e0e0e0; border-radius:10px; font-family:monospace; font-weight:bold; color:#333; }
        .camera-btn { width:60px; border:none; border-radius:10px; background:#1a73e8; color:white; font-size:24px; cursor:pointer; }
        #cameraArea { display:none; position:fixed; left:0; top:0; width:100%; height:100%; background:black; z-index:9999; }
        #video { width:100%; height:100%; object-fit:cover; }
        .scan-guide { position:absolute; left:5%; top:43%; width:90%; height:50px; border:3px solid #00ff66; border-radius:8px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); }
        .capture-btn { position:absolute; bottom:60px; left:50%; transform:translateX(-50%); width:80px; height:80px; border-radius:50%; border:8px solid rgba(255,255,255,0.5); background:white; }
        .loading { margin-top:20px; text-align:center; display:none; color:#1a73e8; font-weight:bold; }
        canvas { display:none; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">차대번호 OCR 스캐너</div>
    <div id="status" style="font-size:11px; color:#999; text-align:center; margin-bottom:10px;">라이브러리 로드 중...</div>
    <div class="input-row">
        <input type="text" id="vinNo" placeholder="인식 결과 출력" readonly>
        <button class="camera-btn" id="openBtn" onclick="openCamera()" disabled>📷</button>
    </div>
    <div id="loading" class="loading">⚙️ 이미지 최적화 및 분석 중...</div>
</div>

<div id="cameraArea">
    <video id="video" autoplay playsinline></video>
    <div class="scan-guide"></div>
    <button class="capture-btn" onclick="process()"></button>
    <button style="position:absolute; top:20px; right:20px; padding:10px 20px; background:white; border-radius:5px; border:none;" onclick="closeCamera()">닫기</button>
</div>

<canvas id="canvasInput"></canvas>
<canvas id="canvasOutput"></canvas>

<script>
let stream;
function onOpenCvReady() {
    document.getElementById('status').innerText = '✅ 준비 완료';
    document.getElementById('openBtn').disabled = false;
}

async function openCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        document.getElementById('cameraArea').style.display = 'block';
        document.getElementById('video').srcObject = stream;
    } catch(e) { alert('카메라 실행 실패'); }
}

function closeCamera() {
    if(stream) stream.getTracks().forEach(t => t.stop());
    document.getElementById('cameraArea').style.display = 'none';
}

async function process() {
    document.getElementById('loading').style.display = 'block';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvasInput');
    const ctx = canvas.getContext('2d');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    // 1. OpenCV 이미지 로드
    let src = cv.imread(canvas);
    let dst = new cv.Mat();
    
    // 2. 가이드 영역 Crop (정교하게 영역 제한)
    let rect = new cv.Rect(canvas.width * 0.05, canvas.height * 0.43, canvas.width * 0.9, canvas.height * 0.06);
    dst = src.roi(rect);

    // 3. 전처리 강화: 그레이스케일 -> 이진화 -> 팽창(Dilation)
    cv.cvtColor(dst, dst, cv.COLOR_RGBA2GRAY, 0);
    cv.threshold(dst, dst, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU); // 반전 이진화
    
    // 글자를 굵게 만들어 8과 S의 구분을 명확히 함
    let kernel = cv.Mat.ones(2, 2, cv.CV_8U);
    cv.dilate(dst, dst, kernel, new cv.Point(-1, -1), 1);
    cv.bitwise_not(dst, dst); // 다시 반전 (흰 배경에 검은 글자)

    cv.imshow('canvasOutput', dst);
    const processedCanvas = document.getElementById('canvasOutput');

    try {
        const worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
            tessedit_char_whitelist: '0123456789ABCDEFGHJKLMNPRSTUVWXYZ',
            tessedit_pageseg_mode: '7',
        });

        const { data: { text } } = await worker.recognize(processedCanvas);
        await worker.terminate();

        let rawText = text.replace(/[^A-Z0-9]/g, '').trim();
        console.log("OCR 원문:", rawText);

        // 4. 지능형 사후 교정 로직 (핵심)
        let kIdx = rawText.indexOf('K');
        if (kIdx !== -1) {
            let vin = rawText.substring(kIdx, kIdx + 17);
            
            // 앞 11자리 중 8을 S로 읽는 경우 교정 (차대번호 8번째 자리는 종종 숫자)
            // 마지막 6자리는 100% 숫자이므로 S/B/G 등을 숫자로 강제 변환
            let prefix = vin.substring(0, 11);
            let suffix = vin.substring(11)
                .replace(/S/g, '5')
                .replace(/B/g, '8')
                .replace(/G/g, '6')
                .replace(/D/g, '0')
                .replace(/O/g, '0');

            // 8번째 자리(연식 등)가 S로 나올 때 8로 의심해보기 (현대/기아차 특성 반영)
            if (prefix[7] === 'S') {
                prefix = prefix.substring(0, 7) + '8' + prefix.substring(8);
            }

            const finalVin = (prefix + suffix).substring(0, 17);
            document.getElementById('vinNo').value = finalVin;
            alert('인식 성공: ' + finalVin);
        } else {
            alert('K로 시작하는 차대번호를 찾지 못했습니다.');
        }
    } catch(e) { console.error(e); }
    finally {
        src.delete(); dst.delete(); kernel.delete();
        document.getElementById('loading').style.display = 'none';
        closeCamera();
    }
}
</script>
</body>
</html>
